name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  API_URL: http://localhost:3000 # solo para validar el entorno; el humo usa MSW, no la API
  NEXT_PUBLIC_SITE_URL: http://localhost:3001
  NEXT_PUBLIC_USE_MSW: 'true'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # toma la versión de "packageManager" en package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Contrato al día (api:generate no debe producir cambios)
        run: |
          pnpm api:generate
          if [ -n "$(git status --porcelain -- src/shared/api/generated)" ]; then
            echo "::error::El cliente generado está desactualizado respecto a docs/contrato/openapi.snapshot.json. Ejecuta 'pnpm api:generate' y versiona el resultado."
            git status --porcelain -- src/shared/api/generated
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Instalar navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright de humo (MSW, sin API)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
